services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-notifications_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Sin healthcheck, `docker compose up -d` vuelve antes de que Postgres
      # acepte conexiones y la primera migracion falla por connection refused.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
